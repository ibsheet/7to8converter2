<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Converter</title>
  <meta name="description" content="IBSheet7 to IBSheet8 Initialization Code Converter">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-title">
        <svg class="icon icon-lg text-blue" viewBox="0 0 24 24"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></svg>
        <h1>IBSheet Code Converter</h1>
        <span class="subtitle">v7 → v8</span>
      </div>
      <a class="btn-github" href="https://github.com/ibsheet/7to8converter2" target="_blank" rel="noopener noreferrer">
        <svg class="icon icon-md" viewBox="0 0 24 24"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
        <span>GitHub</span>
      </a>
    </header>

    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab active" data-tab="page1">Initialize</button>
      <button class="tab" data-tab="page2">Events</button>
    </nav>

    <!-- Toolbar -->
    <section class="toolbar">
      <div class="field" id="init-fields">
        <label for="input-sheet-id">SHEET ID</label>
        <input type="text" id="input-sheet-id" placeholder="Enter value...">
      </div>
      <div class="field" id="init-fields2">
        <label for="input-init-var">Initialize variable</label>
        <input type="text" id="input-init-var" placeholder="Enter value...">
      </div>
      <div class="field" id="init-fields3">
        <label for="input-el">EL</label>
        <input type="text" id="input-el" placeholder="Enter value...">
      </div>

      <div class="toolbar-right">
        <span class="label">Font Size</span>
        <div class="segmented" id="font-size">
          <button data-size="S">S</button>
          <button data-size="M" class="active">M</button>
          <button data-size="L">L</button>
        </div>
        <button class="btn-convert" id="btn-convert">
          <svg class="icon icon-md" viewBox="0 0 24 24"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></svg>
          Convert
        </button>
      </div>
    </section>

    <!-- Initialize panels -->
    <main class="panels" id="panels-page1" data-page="page1">
      <div class="panel panel-legacy">
        <div class="panel-header">
          <h2><span class="dot dot-amber"></span>Initialize - Legacy Code</h2>
          <div>
            <button class="icon-btn btn-maximize" data-panel="legacy" title="Maximize">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/></svg>
            </button>
          </div>
        </div>
        <div class="editor-box"><div class="editor" id="editor-init-legacy"></div></div>
      </div>

      <div class="splitter"><div class="splitter-handle"></div></div>

      <div class="panel panel-converted">
        <div class="panel-header">
          <h2><span class="dot dot-green"></span>Converted Code</h2>
          <div>
            <button class="icon-btn btn-copy" title="Copy to Clipboard">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            </button>
            <button class="icon-btn btn-maximize" data-panel="converted" title="Maximize">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/></svg>
            </button>
          </div>
        </div>
        <div class="editor-box"><div class="editor" id="editor-init-converted"></div></div>
      </div>
    </main>

    <!-- Events panels -->
    <main class="panels" id="panels-page2" data-page="page2" hidden>
      <div class="panel panel-legacy">
        <div class="panel-header">
          <h2><span class="dot dot-purple"></span>Events - Legacy Code</h2>
          <div>
            <button class="icon-btn btn-maximize" data-panel="legacy" title="Maximize">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/></svg>
            </button>
          </div>
        </div>
        <div class="editor-box"><div class="editor" id="editor-evt-legacy"></div></div>
      </div>

      <div class="splitter"><div class="splitter-handle"></div></div>

      <div class="panel panel-converted">
        <div class="panel-header">
          <h2><span class="dot dot-cyan"></span>Converted Code</h2>
          <div>
            <button class="icon-btn btn-copy" title="Copy to Clipboard">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            </button>
            <button class="icon-btn btn-maximize" data-panel="converted" title="Maximize">
              <svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/></svg>
            </button>
          </div>
        </div>
        <div class="editor-box"><div class="editor" id="editor-evt-converted"></div></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.23.0/dist/sweetalert2.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script src="js/ibsheet7to8Convert.js"></script>
  <script src="js/convertEvent.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
